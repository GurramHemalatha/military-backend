spring.application.name=backend

# Dynamic Port (Uses Render's PORT variable when live, defaults to 8081 locally)
server.port=${PORT:8081}

# Dynamic Database Connection (Uses Render environment variables when deployed, falls back to local PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kristallball_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Hibernate / JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123

# JWT Configuration (Uncomment when JWT auth filter is enabled)
# jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# jwt.expiration=86400000